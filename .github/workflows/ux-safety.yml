name: Backoffice UX safety checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'scripts/test_ux_*.cjs'
      - '.github/workflows/ux-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve functional baseline
        run: node scripts/test_ux_preservation.cjs
      - name: Check navigation modules
        run: node scripts/test_ux_navigation.cjs
      - name: Audit mobile navigation
        run: node scripts/test_ux_mobile_audit.cjs
      - name: Verify orders filter controls
        run: node scripts/test_ux_orders_filters.cjs
      - name: Verify stock replenishment filter
        run: node scripts/test_ux_stock_replenish.cjs
