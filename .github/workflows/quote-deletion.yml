name: Quote deletion guard
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sql/quote_deletion_guard_v1.sql'
      - 'tests/quote-deletion*'
      - '.github/workflows/quote-deletion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/quote-deletion.test.cjs
      - run: node scripts/check_pwa_release_versions.cjs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: psql -h 127.0.0.1 -U postgres -d postgres -f tests/quote-deletion.sql
        env:
          PGPASSWORD: postgres
