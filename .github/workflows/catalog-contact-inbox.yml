name: Catalog contact inbox
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'catalog-contact-inbox-v1.js'
      - 'tests/catalog-contact-inbox-v1.test.cjs'
      - 'migrations/catalog_contact_requests_v1.sql'
      - 'tests/catalog-contact-inbox-sql-integration.sql'
      - '.github/workflows/catalog-contact-inbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalog-contact-inbox-v1.test.cjs
      - run: node scripts/check_pwa_release_versions.cjs

      - name: Validar RPC e RLS em Postgres efémero
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -f tests/catalog-contact-inbox-sql-integration.sql
