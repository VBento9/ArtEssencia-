name: Publication overview readonly contracts
on:
  pull_request:
    paths:
      - 'catalog-publication-overview-v1.js'
      - 'catalog-publication-overview-v1.css'
      - 'catalog-classification-bulk-v192.js'
      - 'catalog-review-workflow-v1995.js'
      - 'tests/publication-overview-readonly.test.cjs'
      - '.github/workflows/publication-overview-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check catalog-publication-overview-v1.js
      - run: node --test tests/publication-overview-readonly.test.cjs
