name: Stock photos and PWA release checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'pwa-update.js'
      - 'version.json'
      - 'scripts/test_stock_photos.cjs'
      - 'scripts/test_pwa_update*.cjs'
      - 'scripts/test_pwa_transition.cjs'
      - 'scripts/test_*integrity*.cjs'
      - 'scripts/test_reports_costs*.cjs'
      - 'scripts/test_orders_layout_browser.cjs'
      - 'scripts/test_products_editor_browser.cjs'
      - 'scripts/test_stock_layout_browser.cjs'
      - 'stock-compact-ui.*'
      - 'clients-compact-ui.*'
      - 'purchases-compact-ui.*'
      - 'scripts/test_purchases_layout_browser.cjs'
      - 'scripts/test_clients_layout_browser.cjs'
      - 'product-editor-guide.*'
      - 'products-compact-ui.*'
      - 'order-detail-compact-ui.*'
      - 'orders-compact-ui.*'
      - 'scripts/test_production_atomic_sql.cjs'
      - 'sql/complete-production-backoffice-v1.sql'
      - '.github/workflows/stock-photos-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-photos-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1 @electric-sql/pglite@0.5.11
          npx playwright install --with-deps chromium
      - name: Check PWA update safety
        run: |
          node scripts/test_pwa_update.cjs
          node scripts/test_pwa_update_banner.cjs
      - name: Verify transaction and failure recovery
        run: |
          node scripts/test_production_atomic_sql.cjs
          node scripts/test_backoffice_integrity.cjs
      - name: Serve checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ae-local-http.log 2>&1 &
      - name: Verify stock photo lifecycle and Products compatibility
        run: node scripts/test_stock_photos.cjs

      - name: Verify installed worker update without losing storage
        run: node scripts/test_pwa_transition.cjs

      - name: Verify integrity in browser
        run: node scripts/test_integrity_browser.cjs

      - name: Verify report periods and compact costs
        run: |
          node scripts/test_reports_costs.cjs
          node scripts/test_reports_costs_browser.cjs

      - name: Verify compact order workflow
        run: node scripts/test_orders_layout_browser.cjs

      - name: Verify product editor and draft preservation
        run: node scripts/test_products_editor_browser.cjs

      - name: Verify responsive stock and return to list
        run: node scripts/test_stock_layout_browser.cjs

      - name: Verify client list, drafts and original actions
        run: node scripts/test_clients_layout_browser.cjs

      - name: Verify purchases layout and original stock/cash effects
        run: node scripts/test_purchases_layout_browser.cjs
