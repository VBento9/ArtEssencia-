name: Products compact functional validation
on:
  pull_request:
    paths:
      - 'products-compact-ui.js'
      - 'products-compact-ui.css'
      - 'tests/products-compact-functional.test.cjs'
      - '.github/workflows/products-compact-functional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  products-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node --check products-compact-ui.js
      - run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - run: node --test tests/products-compact-functional.test.cjs
