name: Push device diagnostics
on:
  pull_request:
  push:
    branches: [main]
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/push-device-diagnostics-v19190.test.cjs
      - run: node scripts/check_pwa_release_versions.cjs
