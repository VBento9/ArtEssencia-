name: Stock compact UI contract
on:
  pull_request:
    paths:
      - 'stock-compact-ui.js'
      - 'stock-compact-ui.css'
      - 'index.html'
      - 'tests/stock-compact-contract.test.cjs'
      - '.github/workflows/stock-compact-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-compact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check stock-compact-ui.js
      - name: Contract checks
        run: node --test tests/stock-compact-contract.test.cjs
