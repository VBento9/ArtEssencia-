name: Order unit-price editor
on:
  pull_request:
    paths:
      - 'order-price-edit-v19168.*'
      - 'tests/order-price-edit-19168.test.cjs'
      - 'tests/order-sync-inflight-19170.test.cjs'
      - 'scripts/test_order_price_browser.cjs'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - '.github/workflows/order-price-edit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax, rules and PWA version parity
        run: |
          node --check order-price-edit-v19168.js
          node --test tests/order-price-edit-19168.test.cjs tests/order-sync-inflight-19170.test.cjs
          node scripts/check_pwa_release_versions.cjs
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
          npx playwright install chromium
      - name: Serve local test fixture
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ae-order-price.log 2>&1 &
      - name: Verify price change on tablet and phone
        run: node scripts/test_order_price_browser.cjs
