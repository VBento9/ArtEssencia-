name: Vendas tablet — layout e embalagem 1.9.165
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sale-tablet-ux-v19165.css'
      - 'sw.js'
      - 'version.json'
      - 'tests/sale-tablet-ux-19165.test.cjs'
      - 'scripts/test_sale_tablet_ux_browser.cjs'
      - '.github/workflows/sale-tablet-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/sale-tablet-ux-19165.test.cjs
      - run: node scripts/check_pwa_release_versions.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir ficheiros locais e bloquear Cloud no teste
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ae-sale-tablet-server.log 2>&1 &
      - name: Verificar formulário e persistência
        run: node scripts/test_sale_tablet_ux_browser.cjs
