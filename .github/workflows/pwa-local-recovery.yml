name: PWA local recovery safety
on:
  pull_request:
    paths:
      - 'pwa-update.js'
      - 'tests/pwa-update-local-recovery-v19187.test.cjs'
      - '.github/workflows/pwa-local-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local backup recovery safeguards
        run: node --test tests/pwa-update-local-recovery-v19187.test.cjs
      - name: Check PWA version parity
        run: node scripts/check_pwa_release_versions.cjs
