name: Box conversion integration contracts
on:
  pull_request:
    paths:
      - 'boxes-atelier-ui-v1.js'
      - 'sql/box_conversion_preserve_preferences_REVIEW_ONLY.sql'
      - 'tests/box-conversion-integration-contract.test.cjs'
      - '.github/workflows/box-conversion-integration-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-box-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check boxes-atelier-ui-v1.js
      - name: Execute isolated conversion contracts
        run: node --test tests/box-conversion-integration-contract.test.cjs
