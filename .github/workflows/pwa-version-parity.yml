name: PWA version parity
on:
  pull_request:
    paths:
      - 'index.html'
      - 'version.json'
      - 'sw.js'
      - 'pwa-update.js'
      - 'scripts/check_pwa_release_versions.cjs'
      - '.github/workflows/pwa-version-parity.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify PWA release version alignment
        run: node scripts/check_pwa_release_versions.cjs
