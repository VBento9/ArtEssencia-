<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtEssencia — Stock compacto (protótipo isolado)</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#252327;background:#f8f6f3}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:20px}h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:#666}section{background:#fff;border:1px solid #e7e1d9;border-radius:14px;margin-top:18px;padding:16px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.summary div{background:#f5f1eb;padding:15px;border-radius:12px}.summary strong{display:block;font-size:27px}.summary small{color:#675d53}nav{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}button,select,input{font:inherit;border-radius:9px;border:1px solid #dcd4cb;background:white;padding:10px}button{cursor:pointer}button[aria-selected=true]{background:#322f30;color:white}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:160px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;border-bottom:1px solid #ebe8e4;padding:11px 8px}th{font-size:12px;color:#6c6865}.badge{font-size:12px;border-radius:20px;background:#ecebe9;padding:3px 8px}.low{background:#fff0cc}.empty{background:#ffe1dc}.pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}dialog{border:1px solid #d8d0c5;border-radius:14px;max-width:520px;width:calc(100% - 25px);padding:22px}dialog::backdrop{background:#17141480}.note{color:#6f6862;font-size:13px}#panel{min-height:160px}@media(max-width:600px){main{padding:12px}.summary strong{font-size:20px}td:nth-child(2),th:nth-child(2){display:none}.tools{display:grid}.tools input{min-width:0}th,td{padding:10px 4px}} 
</style></head><body><main><header><h1>Stock</h1><p>Protótipo de interface · Sem ligação à base de dados · Não executa movimentos reais</p></header>
<section class="summary"><div><strong id="count">0</strong><small>Materiais</small></div><div><strong id="low">0</strong><small>Stock baixo</small></div><div><strong id="empty">0</strong><small>Esgotados</small></div></section>
<section><nav role="tablist" aria-label="Secções de stock"><button role="tab" data-tab="Materiais" aria-selected="true">Materiais</button><button role="tab" data-tab="Movimentos">Movimentos</button><button role="tab" data-tab="Alertas">Alertas</button><button role="tab" data-tab="Inventário">Inventário</button></nav><div id="panel"></div></section>
<dialog id="detail"><h2 id="detailTitle"></h2><p id="detailDescription"></p><p class="note">Na integração, este painel deverá reutilizar os controlos e validações existentes, sem gravar quantidades diretamente.</p><button id="close">Fechar</button></dialog>
</main><script>
'use strict';
const data=[{id:1,name:'Cera de soja',category:'Ceras',qty:8500,unit:'g',minimum:1000},{id:2,name:'Cera de colza',category:'Ceras',qty:1200,unit:'g',minimum:2000},{id:3,name:'Pumpkin Spice',category:'Fragrâncias',qty:50,unit:'g',minimum:100},{id:4,name:'Âmbar & Sândalo',category:'Fragrâncias',qty:240,unit:'g',minimum:100},{id:5,name:'Pavio algodão',category:'Pavios',qty:120,unit:'un.',minimum:20},{id:6,name:'Frascos 200 ml',category:'Recipientes',qty:0,unit:'un.',minimum:12}];
let tab='Materiais',query='',category='Todas',page=1;const size=5,panel=document.querySelector('#panel'),dialog=document.querySelector('#detail');
const status=m=>m.qty===0?'Esgotado':m.qty<m.minimum?'Baixo':'Normal';
function el(tag,text,attrs={}){const x=document.createElement(tag);x.textContent=text;for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x}
function render(){document.querySelector('#count').textContent=data.length;document.querySelector('#low').textContent=data.filter(m=>status(m)==='Baixo').length;document.querySelector('#empty').textContent=data.filter(m=>status(m)==='Esgotado').length;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));panel.replaceChildren();
if(tab!=='Materiais'&&tab!=='Alertas'){panel.append(el('h2',tab),el('p',tab==='Movimentos'?'O histórico real de entradas, saídas e ajustes deverá ser apresentado aqui, mantendo as funções existentes.':'Conferência física e correções deverão continuar a utilizar os fluxos e permissões existentes.'));return}
const tools=el('div','',{class:'tools'}),input=el('input','',{placeholder:'Pesquisar material…','aria-label':'Pesquisar material'});input.value=query;input.addEventListener('input',e=>{query=e.target.value;page=1;const start=input.selectionStart;render();const newInput=panel.querySelector('input');newInput.focus();newInput.setSelectionRange(start,start)});tools.append(input);
const select=el('select','',{'aria-label':'Categoria'});['Todas',...new Set(data.map(m=>m.category))].forEach(c=>{const o=el('option',c,{value:c});select.append(o)});select.value=category;select.addEventListener('change',e=>{category=e.target.value;page=1;render()});tools.append(select);panel.append(tools);
const matches=data.filter(m=>(tab!=='Alertas'||status(m)!=='Normal')&&(category==='Todas'||m.category===category)&&m.name.toLocaleLowerCase('pt-PT').includes(query.toLocaleLowerCase('pt-PT')));
const pages=Math.max(1,Math.ceil(matches.length/size));page=Math.min(page,pages);const table=el('table','');const head=el('tr','');['Material','Categoria','Disponível','Estado'].forEach(t=>head.append(el('th',t)));const thead=document.createElement('thead');thead.append(head);table.append(thead);const tbody=document.createElement('tbody');
matches.slice((page-1)*size,page*size).forEach(m=>{const tr=el('tr','');const name=el('button',m.name);name.addEventListener('click',()=>{document.querySelector('#detailTitle').textContent=m.name;document.querySelector('#detailDescription').textContent='Disponível: '+m.qty+' '+m.unit+' · Mínimo: '+m.minimum+' '+m.unit+' · Estado: '+status(m);dialog.showModal()});const a=el('td','');a.append(name);tr.append(a,el('td',m.category),el('td',m.qty+' '+m.unit));const s=el('td',''),label=el('span',status(m),{class:'badge '+(status(m)==='Baixo'?'low':status(m)==='Esgotado'?'empty':'')});s.append(label);tr.append(s);tbody.append(tr)});table.append(tbody);panel.append(table);if(!matches.length)panel.append(el('p','Nenhum material encontrado.'));
const pager=el('div','',{class:'pagination'}),prev=el('button','Anterior'),next=el('button','Seguinte');prev.disabled=page===1;next.disabled=page===pages;prev.addEventListener('click',()=>{page--;render()});next.addEventListener('click',()=>{page++;render()});pager.append(prev,el('span',page+' / '+pages),next);panel.append(pager,el('p','Dados demonstrativos; não representam o stock real.',{class:'note'}))}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;page=1;render()}));document.querySelector('#close').addEventListener('click',()=>dialog.close());render();
</script></body></html>
