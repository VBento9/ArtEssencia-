<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4c3025"><title>ArtEssencia — Protótipo estrutural</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#34271f;background:#f7f5f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100dvh}.side{background:#422c24;color:white;padding:20px 12px;position:sticky;top:0;height:100dvh;overflow:auto}.brand{padding:8px 12px 20px;font-size:20px;font-weight:850;letter-spacing:.4px}.brand small{font-size:11px;font-weight:500;display:block;opacity:.7;margin-top:4px}.nav{display:grid;gap:3px}.nav button{width:100%;text-align:left;color:#f4eae4;border:0;background:transparent;border-radius:11px;padding:11px 12px;font-size:13px}.nav button.selected{background:#f4ece3;color:#44271e;font-weight:800}.main{min-width:0;padding:24px 28px 90px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8e6b58;font-weight:850}.top h1{font-size:25px;margin:5px 0}.muted{font-size:13px;color:#806c60}.flag{background:#fff0d9;color:#765220;padding:7px 11px;border-radius:99px;font-weight:750;font-size:11px;white-space:nowrap}.notice{border:1px solid #eadac8;background:#fffdf7;color:#705441;border-radius:12px;padding:11px 14px;margin:17px 0;font-size:12px}.section{display:none}.section.active{display:block}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:19px 0}.metric{border:1px solid #e9e2db;border-radius:14px;background:#fff;padding:16px;min-width:0}.metric strong{font-size:17px;display:block;margin:8px 0}.metric small{font-size:11px;color:#826b5d}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:14px;margin-top:15px}.panel{background:white;border:1px solid #e9e2db;border-radius:16px;padding:17px;min-width:0}.panel h2{margin:0 0 6px;font-size:17px}.panel p{color:#867568;font-size:12px;margin:0 0 13px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:thin}.tab{white-space:nowrap;border:1px solid #e9dfd7;background:#fbf9f6;color:#624b3c;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:750}.tab[aria-selected=true]{background:#51382c;color:white;border-color:#51382c}.content{border-top:1px solid #eee8e3;padding-top:15px;min-height:175px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:#6f5a4c;font-weight:750;font-size:11px;margin-bottom:6px}.field input{width:100%;border:1px solid #e8ddd4;border-radius:9px;padding:11px;background:#fbfaf8;font-size:13px}.placeholder{background:#f8f6f3;border:1px dashed #d8c9bc;padding:17px;border-radius:10px;color:#786355;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.btn{background:#51382c;color:white;border:0;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:750}.btn.alt{background:#eee8e3;color:#4c362a}.sideitems{display:grid;gap:9px}.sideitem{background:#f8f5f1;border-radius:11px;padding:12px;font-size:12px}.sideitem b{display:block;margin-bottom:4px}.sideitem span{color:#786558}.rows{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid #eee7e1;border-radius:10px;padding:12px;font-size:12px}.item b{font-size:13px}.item span{font-size:11px;color:#937b68}.bottom{display:none}.secondarytitle{font-size:13px;font-weight:800;margin:24px 0 10px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{background:#fff;border:1px solid #e9e2db;padding:15px;border-radius:13px;font-size:12px}.tile b{display:block;margin-bottom:6px;font-size:13px}.tile span{color:#826c5d}.navgroup{font-size:10px;opacity:.65;margin:15px 12px 6px;letter-spacing:.08em}.mobilemenu{display:none}
@media(max-width:1050px){.layout{grid-template-columns:170px minmax(0,1fr)}.side{padding:12px 7px}.workspace{grid-template-columns:minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:17px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.layout{display:block}.side{display:none}.main{padding:17px 13px 86px}.top h1{font-size:22px}.top{align-items:flex-start}.notice{font-size:11px}.metrics{gap:8px}.metric{padding:11px}.metric strong{font-size:14px}.panel{padding:13px}.fields{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid #e4dbd4;padding:8px;gap:3px;overflow-x:auto}.bottom button{flex:1 0 auto;background:none;border:0;color:#73594a;padding:8px 10px;font-size:11px;border-radius:9px}.bottom button.selected{background:#f0e8df;color:#4b2f23;font-weight:850}.workspace{gap:9px}.flag{font-size:10px}.content{min-height:150px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">ArtEssencia<small>Backoffice · Protótipo visual</small></div><div class="nav" id="sidenav"></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Nova organização · Demonstração</div><h1 id="heading">Dashboard operacional</h1><span class="muted" id="subtitle">Prioridades e tarefas do dia num só local</span></div><span class="flag">Sem dados reais</span></div><div class="notice">Protótipo isolado: podes explorar os módulos e os separadores. Os botões demonstrativos não gravam, não imprimem e não comunicam com a Cloud.</div><div id="app"></div></main></div><nav class="bottom" id="bottomnav" aria-label="Navegação móvel"></nav>
<script>
const modules=[
{id:'dashboard',title:'Dashboard',sub:'Prioridades diárias',tabs:['Prioridades','Indicadores','Ações rápidas']},
{id:'products',title:'Produtos',sub:'Criação, edição e publicação',tabs:['Geral','Composição','Custos e PVP','Fotografias','Publicação']},
{id:'orders',title:'Encomendas',sub:'Gestão completa de cada encomenda',tabs:['Resumo','Artigos','Produção','Pagamentos','Histórico e ações']},
{id:'stock',title:'Stock',sub:'Inventário e necessidades',tabs:['Visão geral','Matérias-primas','Reposição','Movimentos','Histórico']},
{id:'production',title:'Produção',sub:'Planeamento e execução',tabs:['Agenda','Em produção','Pendentes','Concluídas','Materiais necessários']},
{id:'purchases',title:'Compras',sub:'Fornecedores e entradas',tabs:['Necessidades','Fornecedores','Compras','Entradas de stock']},
{id:'clients',title:'Clientes',sub:'Contactos e histórico',tabs:['Lista','Detalhe','Encomendas','Histórico']},
{id:'costs',title:'Custos',sub:'Custos e rentabilidade',tabs:['Visão geral','Materiais','Custos gerais','Margens']},
{id:'visual',title:'Catálogo Visual',sub:'Preparação de conteúdos',tabs:['Projetos','Composição','Pré-visualização','Exportação']},
{id:'catalog',title:'Catálogo Digital',sub:'Estado e publicações',tabs:['Publicados','Por publicar','Disponibilidade']},
{id:'deliveries',title:'Entregas',sub:'Zonas e estimativas',tabs:['Visão geral','Localidades','Tarifas','Estimativas']},
{id:'stats',title:'Estatísticas',sub:'Análise operacional',tabs:['Resumo','Vendas','Interações','Tendências']},
{id:'campaigns',title:'Campanhas',sub:'Promoções e comunicação',tabs:['Ativas','Criar','Resultados']},
{id:'posts',title:'Publicações',sub:'Conteúdos e redes',tabs:['Rascunhos','Planeadas','Publicadas']},
{id:'settings',title:'Definições',sub:'Configuração e segurança',tabs:['Geral','Segurança','Integrações','PWA']}
];let active='dashboard',activeTabs={};const byId=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){byId('sidenav').innerHTML=modules.map((m,i)=>((i===0||i===1||i===6||i===8||i===12)?'<div class="navgroup">'+({0:'OPERACIONAL',1:'GESTÃO',6:'ADMINISTRAÇÃO',8:'CANAIS',12:'MARKETING'}[i])+'</div>':'')+'<button type="button" data-module="'+m.id+'" class="'+(active===m.id?'selected':'')+'">'+m.title+'</button>').join('');byId('bottomnav').innerHTML=modules.filter(x=>['dashboard','products','orders','stock','production'].includes(x.id)).map(m=>'<button data-module="'+m.id+'" class="'+(active===m.id?'selected':'')+'">'+m.title+'</button>').join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{active=b.dataset.module;render()})}
function sampleContent(id,tab){if(id==='products'){if(tab==='Geral')return '<div class="fields">'+['Nome do produto','Código / Referência','Categoria / Família','Coleção','Estado / Disponibilidade','Características'].map(t=>'<div class="field"><label>'+t+'</label><input aria-label="'+t+'" placeholder="Exemplo de campo · sem gravação"></div>').join('')+'</div>';if(tab==='Composição')return '<div class="placeholder"><b>Ficha técnica e composição</b><p>Materiais, quantidades, calculadora de cera e fragrância e desperdício — organização prevista, sem cálculos reais nesta demonstração.</p></div>';if(tab==='Custos e PVP')return '<div class="cards"><div class="tile"><b>Custos de materiais</b><span>Calculados pelo motor existente</span></div><div class="tile"><b>Margens</b><span>Visualização compacta</span></div><div class="tile"><b>PVP</b><span>Preço editável no Backoffice real</span></div></div>';if(tab==='Fotografias')return '<div class="cards">'+[1,2,3].map(n=>'<div class="placeholder">Fotografia '+n+'<p>Imagem real na aplicação final</p></div>').join('')+'</div>';return '<div class="rows">'+['Catálogo Digital','Disponibilidade pública','Loja Online (mantida fechada)'].map(x=>'<div class="item"><b>'+x+'</b><span>Estado visual</span></div>').join('')+'</div>'}
if(id==='orders'){return '<div class="rows">'+({'Resumo':['Cliente e estado','Total e saldo','Próximas ações'],'Artigos':['Produtos e quantidades','Personalizações','Preços registados'],'Produção':['Estado de produção','Materiais necessários','Ligação à ficha técnica'],'Pagamentos':['Total','Pagamentos recebidos','Saldo em dívida'],'Histórico e ações':['Linha temporal','Mensagens','Impressão / PDF']}[tab]||[]).map(x=>'<div class="item"><b>'+x+'</b><span>Zona de consulta</span></div>').join('')+'</div>'}
if(id==='dashboard')return '<div class="rows">'+['Encomendas que precisam de atenção','Produção pendente','Materiais críticos','Entregas próximas'].map(x=>'<div class="item"><b>'+x+'</b><span>Abrir tarefa no Backoffice final</span></div>').join('')+'</div>';
return '<div class="rows">'+['Consulta rápida','Filtros e pesquisa','Operações existentes preservadas'].map(x=>'<div class="item"><b>'+tab+' — '+x+'</b><span>Pré-visualização da estrutura</span></div>').join('')+'</div>'}
function render(){const m=modules.find(x=>x.id===active),tab=activeTabs[active]||m.tabs[0];byId('heading').textContent=m.title+(active==='dashboard'?' operacional':'');byId('subtitle').textContent=m.sub;nav();byId('app').innerHTML='<div class="metrics">'+[{a:'Prioridades',b:'Visão imediata'},{a:'Navegação',b:'Separadores'},{a:'Ecrãs',b:'Tablet e móvel'},{a:'Dados',b:'Sem gravação'}].map(x=>'<div class="metric"><small>'+x.a+'</small><strong>'+x.b+'</strong><small>Estrutura demonstrativa</small></div>').join('')+'</div><div class="workspace"><div class="panel"><h2>'+m.title+' · área de trabalho</h2><p>Organização compacta, sem alterar os processos já implementados.</p><div class="tabs" role="tablist">'+m.tabs.map(t=>'<button role="tab" aria-selected="'+(t===tab)+'" data-tab="'+escapeHtml(t)+'" class="tab">'+escapeHtml(t)+'</button>').join('')+'</div><div class="content">'+sampleContent(m.id,tab)+'</div><div class="actions"><button class="btn" type="button" id="demoMain">Guardar / Ação principal</button><button class="btn alt" type="button" id="demoCancel">Cancelar / Voltar</button></div></div><aside class="panel"><h2>Contexto rápido</h2><p>Informações úteis sem abandonar o módulo.</p><div class="sideitems"><div class="sideitem"><b>Estado</b><span>Os registos reais não são carregados</span></div><div class="sideitem"><b>Ligação entre módulos</b><span>Encomendas, Produção e Stock mantêm as suas relações na aplicação real</span></div><div class="sideitem"><b>Ação principal visível</b><span>Barra de ação reduz procura e scroll</span></div></div></aside></div><div class="secondarytitle">Mudanças visuais propostas</div><div class="cards"><div class="tile"><b>Menos scroll</b><span>Conteúdo separado por tarefa</span></div><div class="tile"><b>Mais densidade</b><span>Cartões menores e grelhas adaptáveis</span></div><div class="tile"><b>Contexto</b><span>Informação útil perto das ações</span></div></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTabs[active]=b.dataset.tab;render()});['demoMain','demoCancel'].forEach(x=>byId(x).onclick=()=>alert('Demonstração visual: nenhuma ação foi executada nem foram alterados dados.'))}
render();
</script></body></html>
