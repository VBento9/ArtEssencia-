<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ARTESSENCIA — Diagnóstico biométrico</title><style>body{font:16px system-ui,sans-serif;background:#fffaf5;color:#3d241a;margin:0;padding:24px}.panel{max-width:540px;margin:7vh auto;padding:28px;border:1px solid #e8d8c9;border-radius:18px;background:white}button{background:#5a240b;color:white;border:0;border-radius:12px;padding:14px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#result{margin-top:20px;line-height:1.6;white-space:pre-line}small{color:#70594d}a{color:#5a240b}</style></head><body><main class="panel"><h1>ARTESSENCIA</h1><h2>Diagnóstico biométrico</h2><p>Teste isolado da compatibilidade WebAuthn deste dispositivo. Não inicia sessão, não solicita dados e não altera o Backoffice.</p><button id="check" type="button">Verificar este dispositivo</button><p id="result" role="status" aria-live="polite">Ainda não foi efetuada a verificação.</p><small>Esta página é experimental. A autenticação biométrica não está ativa.</small></main><script type="module">import {inspectPasskeyCapabilities} from './security/passkey-capabilities.js';const b=document.getElementById('check'),r=document.getElementById('result');b.addEventListener('click',async()=>{b.disabled=true;r.textContent='A verificar…';try{const c=await inspectPasskeyCapabilities();r.textContent=!c.secureContext?'É necessária uma ligação HTTPS segura.':!c.webAuthnAvailable?'WebAuthn não está disponível neste navegador.':c.platformAuthenticatorAvailable?'Autenticador biométrico/do dispositivo disponível. O login biométrico ainda não está ativo.':'WebAuthn disponível, mas sem autenticador de plataforma confirmado. O login atual mantém-se.'}catch{r.textContent='Não foi possível concluir o diagnóstico. O login atual não foi alterado.'}finally{b.disabled=false}})</script></body></html>
